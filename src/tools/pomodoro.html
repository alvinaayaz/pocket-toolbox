<div class="card" style="text-align: center; max-width: 500px; margin: 0 auto;">
  <h2>Pomodoro Focus Timer</h2>
  <p>Stay in flow with simple, quiet focus sessions.</p>

  <div style="margin: 2rem 0;">
    <div id="pomo-display" style="font-family: monospace; font-size: 4rem; font-weight: 700; color: var(--text-main); letter-spacing: -2px;">25:00</div>
    <div id="pomo-status" style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); font-weight: 600; margin-top: 0.5rem;">Work Session</div>
  </div>

  <div style="display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem;">
    <button id="pomo-start" style="padding: 0.75rem 1.75rem;">Start Focus</button>
    <button id="pomo-pause" style="background-color: var(--text-muted); padding: 0.75rem 1.5rem;" disabled>Pause</button>
    <button id="pomo-reset" style="background-color: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 0.75rem 1.25rem;">Reset</button>
  </div>

  <div style="display: flex; gap: 1rem; justify-content: center; font-size: 0.85rem; color: var(--text-muted);">
    <label>Work: <input type="number" id="pomo-work-min" value="25" min="1" max="60" style="width: 50px; text-align: center; padding: 0.2rem;"></label>
    <label>Break: <input type="number" id="pomo-break-min" value="5" min="1" max="30" style="width: 50px; text-align: center; padding: 0.2rem;"></label>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    let timer = null;
    let secondsLeft = 25 * 60;
    let isWorking = true;
    let isRunning = false;

    const display = document.getElementById("pomo-display");
    const status = document.getElementById("pomo-status");
    const startBtn = document.getElementById("pomo-start");
    const pauseBtn = document.getElementById("pomo-pause");
    const resetBtn = document.getElementById("pomo-reset");
    const workInput = document.getElementById("pomo-work-min");
    const breakInput = document.getElementById("pomo-break-min");

    function updateDisplay() {
      const mins = Math.floor(secondsLeft / 60).toString().padStart(2, "0");
      const secs = (secondsLeft % 60).toString().padStart(2, "0");
      display.textContent = `${mins}:${secs}`;
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      startBtn.disabled = true;
      pauseBtn.disabled = false;

      timer = setInterval(() => {
        if (secondsLeft > 0) {
          secondsLeft--;
          updateDisplay();
        } else {
          clearInterval(timer);
          isRunning = false;
          if (window.triggerConfetti) window.triggerConfetti();

          isWorking = !isWorking;
          status.textContent = isWorking ? "Work Session" : "Break Time";
          secondsLeft = (isWorking ? parseInt(workInput.value) : parseInt(breakInput.value)) * 60;
          updateDisplay();
          showToast(isWorking ? "Back to focus!" : "Time for a quick break!");
          startBtn.disabled = false;
          pauseBtn.disabled = true;
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timer);
      isRunning = false;
      startBtn.disabled = false;
      pauseBtn.disabled = true;
    }

    function resetTimer() {
      clearInterval(timer);
      isRunning = false;
      isWorking = true;
      status.textContent = "Work Session";
      secondsLeft = parseInt(workInput.value) * 60;
      updateDisplay();
      startBtn.disabled = false;
      pauseBtn.disabled = true;
    }

    startBtn.addEventListener("click", startTimer);
    pauseBtn.addEventListener("click", pauseTimer);
    resetBtn.addEventListener("click", resetTimer);
    workInput.addEventListener("change", () => { if (!isRunning && isWorking) resetTimer(); });
  });
</script>
